site_name: !ENV [ SITE_NAME, 'Doctrine Diagram Bundle - dev' ]
copyright: © 2023-2026 Jawira Portugal
site_author: Jawira Portugal
strict: true
use_directory_urls: false
nav:
    - 'index.md'
    - Install the bundle: 'installing.md'
    - Generating diagrams: 'usage.md'
    - Configure the bundle: 'configuration.md'
    - PlantUML setup: 'plantuml.md'
    - 'known-issues.md'
markdown_extensions:
    - admonition
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
theme:
    name: material
    palette:
        # Palette toggle for automatic mode
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: Switch to light mode

        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to system preference
