name: Bundle install

on:
  pull_request:

jobs:
  sy7x:
    strategy:
      matrix:
        sf: [ '7.4.*' ]
        php: [ '8.2','8.3','8.4','8.5' ]
    uses: ./.github/workflows/install-bundle.yaml
    with:
      symfony: ${{ matrix.sf }}
      php: ${{ matrix.php }}

  sy8x:
    strategy:
      matrix:
        sf: [ '8.0.*', '8.1.*' ]
        php: [ '8.4','8.5' ]
    uses: ./.github/workflows/install-bundle.yaml
    with:
      symfony: ${{ matrix.sf }}
      php: ${{ matrix.php }}
